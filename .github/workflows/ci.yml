name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skills:
    name: Agent Skills validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Zero-dependency on purpose, so this job needs no install step.
      - name: Validate skills against the agentskills.io spec
        run: node scripts/validate-skills.mjs skills
      - name: Validate bundle.json against the bundle schema and the skills
        run: node scripts/validate-bundle.mjs .

  test:
    name: Tests (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    defaults:
      run:
        working-directory: skills/markdown-deck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm install --no-audit --no-fund
      # The browser tests skip themselves without playwright; install it on one leg so
      # the canvas, fitting and PDF checks run somewhere.
      - name: Install playwright
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm install --no-save --no-audit --no-fund playwright pdf-lib && npx playwright install --with-deps chromium
      - name: Test
        run: npm test
      - name: Build the example
        run: node bin/markdown-deck.mjs build examples/example.md --out .tmp/example --theme default --no-pdf

  versions:
    name: Each skill's versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SKILL.md, package.json and the marketplace entry agree, per skill
        run: |
          fail=0
          for d in skills/*/; do
            name=$(basename "$d")
            skill=$(sed -n 's/^  version: "\(.*\)"/\1/p' "$d/SKILL.md")
            market=$(node -p "(require('./.claude-plugin/marketplace.json').plugins.find(p => p.name === '$name') || {}).version")
            echo "$name: SKILL.md $skill, marketplace.json $market"
            [ "$skill" = "$market" ] || fail=1
          done
          pkg=$(node -p "require('./skills/markdown-deck/package.json').version")
          skill=$(sed -n 's/^  version: "\(.*\)"/\1/p' skills/markdown-deck/SKILL.md)
          echo "markdown-deck: package.json $pkg"; [ "$pkg" = "$skill" ] || fail=1
          exit $fail

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v6
