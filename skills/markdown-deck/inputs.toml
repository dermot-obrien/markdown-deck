# SPDX-License-Identifier: Apache-2.0
#
# Repository-wide defaults this skill accepts. The consuming repository answers in
# [suite.markdown-deck] of its .agents/skill-bindings.toml. Every key is optional, and a
# deck's own front matter overrides any of them for that deck:
#
#   binding            front matter overriding it
#   theme              deck_theme
#   palette            deck_palette
#   background         deck_background
#   comments           deck_comments
#   thumbnails         deck_thumbnails
#   slideNumbers       deck_slide_numbers
#   feedbackTo         deck_feedback_to
#   feedbackSubject    deck_feedback_subject
#   pdf                deck_pdf
#   tableRows          deck_table_rows
#   documentBase       deck_document_base
#
# Checked by:  python <skills>/model/bin/model.py doctor --skill markdown-deck

[inputs]
short_description = "Repository defaults for building decks"

[inputs.options.theme]
type = "str"
required = false
default = "default"
description = "Theme for every deck: a built-in name or a path to a .css file"

[inputs.options.comments]
type = "str"
required = false
default = "false"
description = "true to give every deck the per-slide review comments panel"

[inputs.options.thumbnails]
type = "str"
required = false
default = "false"
description = "true to open every deck's slide index with thumbnails rather than titles"

[inputs.options.slideNumbers]
type = "str"
required = false
default = "true"
description = "false to leave the page number off every slide; by default each slide but the first carries one"

[inputs.options.pdf]
type = "str"
required = false
default = "false"
description = """true to export deck.pdf whenever `markdown-deck build` runs, unless --no-pdf
is given. Needs playwright. Does not apply to `publish`, which exports PDFs only with --pdf."""

[inputs.options.tableRows]
type = "str"
required = false
default = "12"
description = """Rows a table may carry on one slide before it continues on the next slide with
its header repeated. 0 never splits, leaving a long table to shrink to fit. A slide overrides
it with table-rows="..." on its deck:slide tag."""

[inputs.options.documentBase]
type = "str"
required = false
description = """Where the workspace's Markdown documents are published, as a URL or a path from
the site root. A slide's link to another .md or .mdx document of the workspace then goes to
that document's page (its path without the extension, index.md and README.md standing for
their folder, a slug in its front matter honoured) rather than to its source file."""

[inputs.options.feedbackTo]
type = "str"
required = false
description = """Where Email review sends a deck's review, for every deck that does not name
its own address. Comma-separate several addresses."""

[inputs.options.feedbackSubject]
type = "str"
required = false
description = "Subject of the review email; defaults to 'Review: <deck title>'"

[inputs.options.mermaid]
type = "str"
required = false
description = """Where decks load mermaid from: a path to mermaid.min.js, copied beside each deck
that has a diagram, or a URL. Unset, an installed mermaid is found and copied, else the CDN."""

[inputs.options.registry]
type = "path"
required = false
description = """The published-deck registry, a JSON file committed with the workspace. When set,
`markdown-deck publish` records every deck URL it publishes and fails when one that was
published disappears, until it is marked retired or redirected there."""

[inputs.options.palette]
type = "table"
required = false
description = """Colour tokens overriding whichever theme is chosen, so an organisation gets
its own palette without a CSS file in the skill. Keys are token names without the `--`
prefix: font-body, font-mono, deck-bg, slide-bg, slide-fg, body, heading, on-heading, rule,
row-alt, accent, accent-deep, accent-wash, code-bg, code-fg, code-inline-bg, cover-bg,
cover-fg, cover-accent, cover-muted, cover-faint, divider-bg, divider-fg, divider-accent,
divider-muted, chrome-fg. An unknown key fails the build
rather than being ignored. Or the name of a scheme in palettes. A deck overrides the
repository palette with deck_palette, which may also name a scheme, or say none for the
theme's own colours."""

[inputs.options.palettes]
type = "table"
required = false
description = """Named colour schemes, each a table of the tokens palette takes, as
[suite.markdown-deck.palettes.<name>]. palette, deck_palette and --palette pick one by name.
An unknown token in any scheme, or an unknown scheme name, fails the build."""

[inputs.options.background]
type = "str"
required = false
description = """An image behind every slide, copied into each deck's assets/ so the deck and
its PDF stay self-contained: a png, jpg, svg or webp path relative to this file, or a table
with image (required), slides (all, cover or content, which is every slide but the cover;
default all), fit (cover, contain or repeat; default cover), position (a CSS
background-position; default center) and wash (0 to 1, a layer of the slide's own ground
colour over the image to keep text legible; default 0). A missing image or an unsupported
type fails the build. A deck overrides it with deck_background, relative to the document,
or turns it off with deck_background: none."""
